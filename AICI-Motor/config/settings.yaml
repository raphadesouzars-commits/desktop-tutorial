# Configuração do AICI-Motor. Nada aqui contém conhecimento jurídico: ele vive em knowledge/.
servidor:
  host: 127.0.0.1                # só a própria máquina; para rede interna, use proxy reverso institucional
  porta: 8765
  cors_origens: ["null", "http://localhost:8765", "http://127.0.0.1:8765"]   # "null" = HTML aberto como arquivo
  token_env: AICI_TOKEN          # se esta variável de ambiente existir, toda chamada exige o cabeçalho X-AICI-Token

caminhos:
  knowledge: knowledge
  vectorstore: vectorstore
  prompts: prompts
  templates: templates
  uploads: uploads
  output: output
  metrics: metrics
  banco: metrics/aici.db
  categorias: config/categorias.json

indexador:
  backend: lexical               # lexical (sem dependências, offline) | chroma (requer chromadb)
  chunk_chars: 1200
  chunk_sobreposicao: 150
  extensoes: [".pdf", ".docx", ".txt", ".md", ".json"]

recuperacao:
  top_k_pareceres: 4
  top_k_precedentes: 4
  top_k_normativos: 4
  top_k_modelos: 2
  peso_coger: 1.25               # RN005: precedentes da COGER pesam mais que os demais
  embeddings:                    # busca híbrida (BM25 + vetores). Requer sentence-transformers e um modelo LOCAL
    habilitado: false
    modelo: BAAI/bge-m3          # ou intfloat/multilingual-e5-large (prefixos "query: " / "passage: "); pode ser a pasta do modelo
    prefixo_consulta: ""
    prefixo_documento: ""
    dispositivo: cpu
    candidatos: 20               # BM25 top 20 + vetores top 20 -> fusão (RRF) -> reclassifica (peso COGER) -> top_k finais

ocr:
  habilitado: true
  idiomas: [pt, en]
  min_caracteres_por_pagina: 40

ia:
  provider: offline              # offline (sem IA) | copilot (Copilot Studio/gateway) | azure (Azure OpenAI) | openai | mock (testes)
  anonimizar: true               # mascara CPF, matrícula, telefone e e-mail antes de enviar à IA
  copilot_chat:                  # modo assistido: o parecerista leva o prompt ao Copilot Chat (conta corporativa) e cola a resposta
    url: "https://m365.cloud.microsoft/chat"
    limite_caracteres: 7500      # tamanho máximo do prompt colado no chat; CONFIRME o limite real com a TI e ajuste
  auditoria:                     # trilha de cada chamada à IA, para o curador (Port. RFB 647/2026, arts. 12 e 19)
    habilitada: true
    registrar_conteudo: true     # grava prompt e resposta (já mascarados) em metrics/ia_auditoria.jsonl
  temperatura: 0.1
  copilot:
    # Preencha com o endpoint/gateway homologado pela RFB. O token NUNCA vai neste arquivo:
    # defina a variável de ambiente indicada em token_env.
    endpoint: ""
    token_env: AICI_COPILOT_TOKEN
    cabecalho_auth: Authorization
    prefixo_auth: "Bearer "
    modelo: ""
    formato: openai              # openai (messages/choices) | custom (usa corpo_template e caminho_resposta)
    corpo_template: ""           # JSON com {{system}} e {{user}}; só no formato custom
    caminho_resposta: "choices.0.message.content"
    timeout_s: 120
    verificar_tls: true
  azure:                         # Azure OpenAI corporativo: a TI informa os três campos abaixo; a chave vai na variável de ambiente
    endpoint: ""                 # https://<recurso>.openai.azure.com
    deployment: ""               # ex.: gpt-4o
    api_version: ""              # ex.: 2024-06-01
    token_env: AICI_AZURE_KEY
    timeout_s: 120
  openai:                        # só para modelos/gateways que a instituição tenha homologado
    confirmo_homologado: false
    endpoint: ""
    modelo: ""
    token_env: AICI_OPENAI_KEY
