<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fórmulas em Cartas — Física &amp; Química</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg1:#FAFCFF;
    --bg2:#F6FBF8;
    --ink:#20263B;
    --ink-soft:#6A7187;
    --card:#FFFFFF;
    --line:#E9EEF6;
    --shadow: 0 10px 28px rgba(30, 50, 90, .10);
    --shadow-sm: 0 4px 14px rgba(30, 50, 90, .09);
    --green:#1E9E6B;
    --green-bg:#E3F8EE;
    --red:#E54D62;
    --red-bg:#FDE9EC;
    --amber:#C98A00;
    --amber-bg:#FFF4DD;
    --fis:#2563EB;
    --fis2:#17B8CE;
    --qui:#16A34A;
    --qui2:#D946EF;
    --accent:#2563EB;
    --radius:22px;
    --radius-sm:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(1100px 650px at 8% -8%, #DCEBFF 0%, transparent 58%),
                radial-gradient(1000px 650px at 100% 0%, #DFFBEA 0%, transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
    color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  #app{max-width:680px;margin:0 auto;padding:16px 16px 8px;}
  h1,h2,h3{margin:0 0 6px;}
  p{margin:0 0 10px;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:3px solid #2563EB;outline-offset:2px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 18px;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand .logo{font-size:28px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));}
  .brand h1{font-size:clamp(16px,4.6vw,21px);font-weight:800;letter-spacing:-.3px;}
  .brand .sub{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .nav-btns{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn,.pill-btn{
    border:none;border-radius:999px;padding:11px 14px;min-height:44px;font-weight:700;font-size:13px;
    background:var(--card);box-shadow:var(--shadow-sm);color:var(--ink);
    transition:transform .15s ease;display:inline-flex;align-items:center;gap:6px;
  }
  .icon-btn{padding:0;width:44px;justify-content:center;font-size:17px;}
  .icon-btn:active,.pill-btn:active{transform:scale(.94);}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .section-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:10px;}

  /* Home: two discipline blocks */
  .disc-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px;}
  @media (min-width:520px){ .disc-grid{grid-template-columns:1fr 1fr;} }
  .disc-card{
    border:none;border-radius:var(--radius);padding:24px 20px;text-align:left;color:#fff;
    box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:150px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .disc-card.fis{background:linear-gradient(135deg,var(--fis),var(--fis2));}
  .disc-card.qui{background:linear-gradient(135deg,var(--qui),var(--qui2));}
  .disc-card:active{transform:scale(.98);}
  .disc-card .emoji{font-size:34px;margin-bottom:6px;}
  .disc-card h2{font-size:22px;font-weight:800;}
  .disc-card .meta{font-size:12.5px;opacity:.9;font-weight:700;margin-top:4px;}
  .disc-card .track{height:9px;background:rgba(255,255,255,.35);border-radius:999px;margin-top:14px;overflow:hidden;}
  .disc-card .fill{height:100%;background:#fff;border-radius:999px;}

  .shortcut-btn{
    width:100%;border:2px dashed var(--line);background:#fff;border-radius:var(--radius-sm);
    padding:16px;font-weight:800;font-size:14.5px;color:var(--ink);text-align:left;
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .shortcut-btn .n{
    background:var(--amber-bg);color:var(--amber);border-radius:999px;min-width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;
  }
  .shortcut-btn:disabled{opacity:.45;}
  .shortcut-btn:active:not(:disabled){transform:scale(.98);}

  .menu-row{display:flex;flex-wrap:wrap;gap:8px;}

  /* chips / selection lists */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{
    border:2px solid var(--line);background:#fff;border-radius:999px;
    padding:11px 15px;min-height:44px;font-weight:700;font-size:13.5px;color:var(--ink);
  }
  .chip:active{transform:scale(.95);}
  .chip.selected{background:var(--chip-color,var(--accent));border-color:var(--chip-color,var(--accent));color:#fff;}

  .serie-heading{font-size:12.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px;}
  .assunto-row{
    display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:9px;min-height:44px;text-align:left;width:100%;
  }
  .assunto-row.selected{border-color:var(--chip-color,var(--accent));background:color-mix(in srgb, var(--chip-color,var(--accent)) 7%, white);}
  .assunto-row .box{
    width:22px;height:22px;border-radius:7px;border:2.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;
  }
  .assunto-row.selected .box{background:var(--chip-color,var(--accent));border-color:var(--chip-color,var(--accent));}
  .assunto-row .info{flex:1;min-width:0;}
  .assunto-row .nome{font-weight:800;font-size:14px;}
  .assunto-row .detail{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .assunto-row .track{height:6px;background:var(--line);border-radius:999px;margin-top:6px;overflow:hidden;}
  .assunto-row .fill{height:100%;border-radius:999px;background:var(--chip-color,var(--accent));}

  .modo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
  .modo-card{
    border:3px solid var(--line);background:#fff;border-radius:var(--radius-sm);
    padding:16px 10px;text-align:center;font-weight:800;font-size:13.5px;
    display:flex;flex-direction:column;align-items:center;gap:7px;min-height:44px;
  }
  .modo-card .emoji{font-size:28px;}
  .modo-card .desc{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .modo-card:active{transform:scale(.96);}
  .modo-card.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 7%, white);box-shadow:var(--shadow-sm);}

  .count-banner{display:flex;align-items:center;gap:8px;background:#EEF4FF;border-radius:var(--radius-sm);padding:12px 14px;font-weight:700;font-size:13.5px;color:var(--accent);margin-bottom:14px;}

  .big-btn{width:100%;border:none;border-radius:999px;padding:16px;font-size:16.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, white));box-shadow:0 10px 22px rgba(37,99,235,.3);min-height:44px;}
  .big-btn:active{transform:scale(.97);}
  .big-btn:disabled{opacity:.4;box-shadow:none;}
  .ghost-btn{width:100%;border:2px solid var(--line);background:#fff;border-radius:999px;padding:14px;font-size:14.5px;font-weight:800;color:var(--ink);margin-top:10px;min-height:44px;}
  .ghost-btn:active{transform:scale(.97);}
  .ghost-btn.warn{border-color:var(--red);color:var(--red);}

  /* session head */
  .session-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .session-head .exit{border:none;background:#fff;box-shadow:var(--shadow-sm);border-radius:999px;width:44px;height:44px;font-weight:800;font-size:16px;color:var(--ink-soft);flex-shrink:0;}
  .session-head .info{text-align:right;min-width:0;}
  .session-head .info b{display:block;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .progress-track{height:8px;border-radius:999px;background:#E7EEFA;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7FD6E0);transition:width .35s ease;}

  /* flashcard */
  .flash-wrap{perspective:1400px;margin-bottom:16px;}
  .flash-card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);}
  .flash-card.flipped{transform:rotateY(180deg);}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);overflow:auto;}
  .flash-front{background:linear-gradient(135deg,var(--tcolor,#2563EB),color-mix(in srgb, var(--tcolor,#2563EB) 55%, white));color:#fff;}
  .flash-front .tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.85;margin-bottom:10px;}
  .flash-front .nome{font-size:clamp(18px,5.6vw,24px);font-weight:800;}
  .flash-front .ctx{font-size:12.5px;opacity:.85;margin-top:8px;font-weight:600;}
  .flash-front .hint{margin-top:16px;font-size:11.5px;opacity:.8;font-weight:700;}
  .flash-back{background:#fff;transform:rotateY(180deg);border:3px solid var(--tcolor,#2563EB);align-items:stretch;text-align:left;}
  .flash-back .formula-big{font-size:clamp(18px,5.6vw,24px);font-weight:800;color:var(--tcolor,#2563EB);margin-bottom:12px;word-break:break-word;text-align:center;}
  .flash-back .vartable{width:100%;font-size:12px;margin-bottom:10px;}
  .flash-back .vartable div{padding:3px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);font-weight:600;}
  .flash-back .vartable b{color:var(--ink);font-weight:800;}
  .flash-back .meta-line{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;line-height:1.5;}
  .flash-back .meta-line b{color:var(--ink);}
  .flash-actions{display:flex;gap:10px;}
  .flash-actions button{flex:1;border:none;border-radius:999px;padding:15px 8px;font-weight:800;font-size:13.5px;min-height:44px;}
  .btn-sabe{background:var(--green-bg);color:var(--green);}
  .btn-revisar{background:var(--red-bg);color:var(--red);}
  .flash-actions button:active{transform:scale(.96);}
  .flash-extra{display:flex;gap:8px;margin-top:10px;}
  .flash-extra button{flex:1;border:2px solid var(--line);background:#fff;border-radius:999px;padding:11px;font-size:12px;font-weight:700;color:var(--ink-soft);min-height:40px;}

  /* question cards (quiz / completar / unidades) */
  .question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border-top:6px solid var(--tcolor,#2563EB);}
  .question-card .topic-tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tcolor,#2563EB);margin-bottom:8px;}
  .question-card .enunciado{font-size:clamp(15px,4.3vw,18px);font-weight:800;line-height:1.4;}
  .question-card .formula-lacuna{font-size:clamp(18px,5vw,22px);font-weight:800;color:var(--ink);background:#F5F8FF;border-radius:12px;padding:14px;margin-top:12px;text-align:center;}
  .opcoes{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .opcao-btn{display:flex;align-items:flex-start;gap:10px;text-align:left;border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:14px;font-weight:700;color:var(--ink);min-height:44px;}
  .opcao-btn .letra{background:var(--line);color:var(--ink-soft);border-radius:999px;width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;}
  .opcao-btn .txt{flex:1;padding-top:2px;}
  .opcao-btn:active{transform:scale(.98);}
  .opcao-btn.correta{background:var(--green-bg);border-color:var(--green);}
  .opcao-btn.correta .letra{background:var(--green);color:#fff;}
  .opcao-btn.errada{background:var(--red-bg);border-color:var(--red);}
  .opcao-btn.errada .letra{background:var(--red);color:#fff;}
  .opcao-btn:disabled{opacity:.8;}
  .erro-txt{font-size:12px;color:var(--red);font-weight:700;margin-top:8px;padding:10px 12px;background:var(--red-bg);border-radius:10px;}
  .feedback-row{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;}
  .next-btn{border:none;border-radius:999px;padding:12px 20px;font-weight:800;font-size:13.5px;color:#fff;background:var(--accent);min-height:44px;}
  .next-btn:active{transform:scale(.95);}
  .reforco-btn{border:none;border-radius:999px;padding:12px 18px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--amber),#F0B23A);min-height:44px;}
  .reforco-btn:active{transform:scale(.95);}

  /* reforço screens */
  .reforco-banner{background:linear-gradient(135deg,var(--amber),#F0B23A);color:#fff;border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow);}
  .reforco-banner .emoji{font-size:40px;margin-bottom:6px;}
  .resolucao-box{background:#F5F8FF;border-radius:12px;padding:14px;margin-top:14px;font-size:13px;color:var(--ink);line-height:1.8;font-weight:600;}
  .resolucao-box .linha{display:block;}
  .reforco-progress{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
  .reforco-dot{width:10px;height:10px;border-radius:999px;background:var(--line);}
  .reforco-dot.ok{background:var(--green);}
  .reforco-dot.bad{background:var(--red);}
  .reforco-dot.atual{background:var(--amber);}

  /* confetti */
  .confetti-piece{position:fixed;top:-10px;width:9px;height:14px;z-index:999;pointer-events:none;border-radius:2px;animation:fall 1.1s ease-in forwards;}
  @keyframes fall{to{transform:translateY(100vh) rotate(400deg);opacity:0;}}

  /* result */
  .result-hero{text-align:center;padding:8px 0 4px;}
  .result-hero .emoji{font-size:50px;}
  .result-stats{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
  .stat{flex:1;min-width:84px;border-radius:16px;padding:16px 8px;text-align:center;}
  .stat .num{font-size:24px;font-weight:800;}
  .stat .lbl{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;}
  .stat.ok{background:var(--green-bg);} .stat.ok .num{color:var(--green);}
  .stat.bad{background:var(--red-bg);} .stat.bad .num{color:var(--red);}
  .stat.pct{background:#EEF4FF;} .stat.pct .num{color:var(--accent);}
  .review-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .review-chip{background:var(--red-bg);color:var(--red);font-weight:700;font-size:12px;border-radius:999px;padding:7px 12px;}

  /* progress / fractions / formula rendering */
  .empty-msg{text-align:center;color:var(--ink-soft);font-weight:600;padding:30px 10px;}
  .ffq-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2;}
  .ffq-num{padding:0 3px;border-bottom:2px solid currentColor;}
  .ffq-den{padding:0 3px;}
  .ffq-sqrt{display:inline-flex;align-items:flex-start;}
  .ffq-rad{font-size:1.05em;margin-right:1px;}
  .ffq-radicand{border-top:2px solid currentColor;padding:0 3px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:200;max-width:90vw;text-align:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,25,40,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-box{background:#fff;border-radius:var(--radius);padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:85vh;overflow-y:auto;}
  .modal-box h3{font-size:17px;font-weight:800;margin-bottom:10px;}
  .modal-box p{font-size:13.5px;color:var(--ink-soft);font-weight:600;line-height:1.6;}
  .modal-box .row{display:flex;gap:10px;margin-top:16px;}
  .modal-box .row button{flex:1;}
  input[type=file]{display:none;}

  @media (min-width:520px){ .modo-grid{grid-template-columns:repeat(4,1fr);} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================================
   RENDERIZADOR DE FÓRMULAS (mini-notação -> HTML). Ver especificação, item 7.
   Suporta: x^{...} (sup), x_{...} (sub), frac{a}{b} (fração empilhada),
   sqrt{...} (raiz com barra), letras gregas por extenso, \cdot, ->, <=>.
   ========================================================================================= */
function applyTokenReplacements(s){
  return s
    .replace(/\\cdot/g, '·')
    .replace(/<=>/g, '⇌')
    .replace(/->/g, '→')
    .replace(/\bDelta\b/g, 'Δ')
    .replace(/\btheta\b/g, 'θ')
    .replace(/\bomega\b/g, 'ω')
    .replace(/\blambda\b/g, 'λ')
    .replace(/\bmu\b/g, 'μ')
    .replace(/\brho\b/g, 'ρ')
    .replace(/\bpi\b/g, 'π')
    .replace(/\bepsilon\b/g, 'ε')
    .replace(/\bphi\b/g, 'φ')
    .replace(/\btau\b/g, 'τ')
    .replace(/\balpha\b/g, 'α')
    .replace(/\bbeta\b/g, 'β')
    .replace(/\bgamma\b/g, 'γ')
    .replace(/\beta\b/g, 'η');
}
function matchBrace(s, openIdx){
  let depth = 0;
  for (let j = openIdx; j < s.length; j++){
    if (s[j] === '{') depth++;
    else if (s[j] === '}') { depth--; if (depth === 0) return j; }
  }
  return s.length - 1;
}
function escChar(c){ return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c; }
function renderStruct(s){
  let out = '', i = 0;
  while (i < s.length){
    if (s.startsWith('frac{', i)){
      const openNum = i + 4;
      const closeNum = matchBrace(s, openNum);
      const j = closeNum + 1;
      if (s[j] === '{'){
        const closeDen = matchBrace(s, j);
        out += `<span class="ffq-frac"><span class="ffq-num">${renderStruct(s.slice(openNum+1, closeNum))}</span><span class="ffq-den">${renderStruct(s.slice(j+1, closeDen))}</span></span>`;
        i = closeDen + 1; continue;
      }
    }
    if (s.startsWith('sqrt{', i)){
      const open = i + 4;
      const close = matchBrace(s, open);
      out += `<span class="ffq-sqrt"><span class="ffq-rad">√</span><span class="ffq-radicand">${renderStruct(s.slice(open+1, close))}</span></span>`;
      i = close + 1; continue;
    }
    if (s[i] === '^' && s[i+1] === '{'){
      const close = matchBrace(s, i+1);
      out += `<sup>${renderStruct(s.slice(i+2, close))}</sup>`;
      i = close + 1; continue;
    }
    if (s[i] === '_' && s[i+1] === '{'){
      const close = matchBrace(s, i+1);
      out += `<sub>${renderStruct(s.slice(i+2, close))}</sub>`;
      i = close + 1; continue;
    }
    out += escChar(s[i]); i++;
  }
  return out;
}
function renderFormula(str){
  if (str == null) return '';
  return renderStruct(applyTokenReplacements(String(str)));
}
/* Tokeniza o lado direito de uma fórmula, respeitando chaves aninhadas — usado no modo "Completar". */
function extractTokens(formulaStr){
  let rhs = formulaStr;
  const eqIdx = formulaStr.indexOf('=');
  if (eqIdx !== -1) rhs = formulaStr.slice(eqIdx + 1);
  const raw = []; let depth = 0, buf = '';
  const splitChars = new Set(['·','×','*','/','+','-','(',')',' ','→','⇌']);
  for (let k = 0; k < rhs.length; k++){
    const ch = rhs[k];
    if (ch === '{'){ depth++; buf += ch; continue; }
    if (ch === '}'){ depth--; buf += ch; continue; }
    if (depth === 0 && splitChars.has(ch)){
      if (buf) raw.push(buf);
      buf = ''; continue;
    }
    buf += ch;
  }
  if (buf) raw.push(buf);
  return [...new Set(raw.filter(Boolean))];
}

/* =========================================================================================

/* =========================================================================================
   PROGRESSO (localStorage) — chave versionada, exportar/importar
   ========================================================================================= */
const LS_KEY = "ffq_progresso_v1";
let localStorageDisponivel = true;
let PROGRESS = {};
try {
  const test = "__ffq_test__";
  localStorage.setItem(test, "1"); localStorage.removeItem(test);
  PROGRESS = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
} catch(e){ localStorageDisponivel = false; PROGRESS = {}; }

function salvarProgresso(){
  if (!localStorageDisponivel) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(PROGRESS)); } catch(e){}
}
function estadoCartao(id){ return PROGRESS[id] || "novo"; }
function marcarCartao(id, estado){ PROGRESS[id] = estado; salvarProgresso(); }

/* =========================================================================================
   HELPERS
   ========================================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function esc(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function letraOpcao(i){ return ["A","B","C","D","E"][i] || "?"; }
function spawnConfetti(){
  const colors = ['#2563EB','#16A34A','#FCC419','#22B8CF','#D946EF','#FF6B6B'];
  for (let i=0;i<20;i++){
    const el = document.createElement('div');
    el.className='confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = (Math.random()*0.15)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1400);
  }
}
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('ffq-toast');
  if (!el){ el = document.createElement('div'); el.id='ffq-toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2600);
}

      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">

      </div>
  `;
  series.forEach(s=>{

function poolAtual(modo){

window.iniciarSessao = function(){
  const base = poolAtual(state.modo);
  if (!base.length) return;
  const ponderado = base.flatMap(c => estadoCartao(c.id) === "revisar" ? [c,c] : [c]);
  state.sessao = {
    modo: state.modo,
    itens: shuffle(ponderado),
    indice: 0,
    acertos: 0,
    erros: 0,
    marcSabe: 0,
    marcRevisar: 0,
    erroItens: [],
    perguntaAtual: null,
    respondida: false,
    flashInvertido: false,
    flipped: false
  };
  if (state.modo !== "flashcard") gerarPergunta();
  state.reforcoAtivo = null;
  state.view = "sessao";
  render();
};
function itemAtual(){ return state.sessao.itens[state.sessao.indice]; }
function corDoItem(item){ return ASSUNTO_MAP[item.assunto] ? ASSUNTO_MAP[item.assunto].cor : "#2563EB"; }

/* =========================================================================================
   GERAÇÃO DE PERGUNTAS (quiz / completar / unidades)
   ========================================================================================= */
function gerarPergunta(){
  const s = state.sessao;
  const item = itemAtual();
  s.respondida = false;
  s.selecionada = null;
  if (s.modo === "quiz") return gerarPerguntaQuiz(item, s);
  if (s.modo === "completar") return gerarPerguntaCompletar(item, s);
  if (s.modo === "unidades") return gerarPerguntaUnidade(item, s);
}

function gerarPerguntaQuiz(item, s){
  const usarSituacao = !!item.uso && Math.random() < 0.4;
  const assuntoObj = ASSUNTO_MAP[item.assunto];
  const irmaos = CARDS.filter(c => c.assunto === item.assunto && c.tipo !== "unidade" && c.id !== item.id);

  if (usarSituacao){
    const outrosNomes = shuffle(irmaos.map(c=>c.nome)).slice(0,4);
    while (outrosNomes.length < 4){
      const extra = shuffle(CARDS.filter(c=>c.disciplina===item.disciplina && c.tipo!=="unidade" && c.id!==item.id && !outrosNomes.includes(c.nome) && c.nome!==item.nome));
      if (!extra.length) break;
      outrosNomes.push(extra[0].nome);
    }
    s.perguntaAtual = {
      tipo: "quiz",
      enunciado: `Em que situação se usa a fórmula abaixo?`,
      formulaExibida: item.formula,
      opcoes: shuffle([{texto:item.nome, correta:true}, ...outrosNomes.map(n=>({texto:n, correta:false, erro:"Fórmula de outra grandeza/situação deste assunto."}))]),
    };
  } else {
    let distratores = shuffle(item.distratores || []).slice(0,4).map(d=>({texto:d.formula, correta:false, erro:d.erro}));
    if (distratores.length < 4){
      const usados = new Set([item.formula, ...distratores.map(d=>d.texto)]);
      const extra = shuffle(irmaos.filter(c=>!usados.has(c.formula))).slice(0, 4-distratores.length)
        .map(c=>({texto:c.formula, correta:false, erro:"Fórmula de outra grandeza deste assunto."}));
      distratores = [...distratores, ...extra];
    }
    s.perguntaAtual = {
      tipo: "quiz",
      enunciado: `Qual é a fórmula de "${item.nome}"?`,
      formulaExibida: null,
      opcoes: shuffle([{texto:item.formula, correta:true}, ...distratores]),
    };
  }
}

function gerarPerguntaCompletar(item, s){
  const assuntoObj = ASSUNTO_MAP[item.assunto];
  const tokens = extractTokens(item.formula);
  const alvo = tokens[Math.floor(Math.random()*tokens.length)] || "?";
  const idx = item.formula.indexOf(alvo);
  const textoLacuna = idx === -1 ? item.formula : item.formula.slice(0,idx) + "{\\_\\_\\_}" + item.formula.slice(idx+alvo.length);
  let candidatos = shuffle((assuntoObj._pool||[]).filter(t=>t!==alvo)).slice(0,3);
  const generico = ['m','v','t','F','g','a','2','θ','k','d','n','h','R','T','P','Q'];
  let gi=0;
  while (candidatos.length<3 && gi<generico.length){
    const g = generico[gi++];
    if (g!==alvo && !candidatos.includes(g)) candidatos.push(g);
  }
  s.perguntaAtual = {
    tipo: "completar",
    enunciado: `Complete a fórmula de "${item.nome}":`,
    textoLacuna,
    opcoes: shuffle([{texto:alvo, correta:true}, ...candidatos.map(c=>({texto:c, correta:false}))]),
  };
}

function gerarPerguntaUnidade(item, s){
  const outrosUnidade = CARDS.filter(c => c.tipo === "unidade" && c.disciplina === item.disciplina && c.id !== item.id);
  const variantes = ["si"];
  if (outrosUnidade.length >= 3) variantes.push("grandeza", "base");
  if (item.conversaoExemplo) variantes.push("conversao");
  const variante = variantes[Math.floor(Math.random()*variantes.length)];

  if (variante === "si"){
    let opcoes = shuffle(item.distratoresUnidade||[]).slice(0,3).map(d=>({texto:d.valor, correta:false, erro:d.erro}));
    if (opcoes.length < 3){
      const usados = new Set([item.unidadeSI, ...opcoes.map(o=>o.texto)]);
      const extra = shuffle(outrosUnidade.filter(c=>!usados.has(c.unidadeSI))).slice(0,3-opcoes.length)
        .map(c=>({texto:c.unidadeSI, correta:false, erro:"Unidade de outra grandeza."}));
      opcoes = [...opcoes, ...extra];
    }
    s.perguntaAtual = { tipo:"unidades", enunciado:`Qual a unidade SI de ${item.grandeza}?`, textoLacuna:null, opcoes: shuffle([{texto:item.unidadeSI, correta:true}, ...opcoes]) };
  } else if (variante === "grandeza"){
    let opcoesBase = shuffle(outrosUnidade).slice(0,3).map(c=>({texto:c.grandeza, correta:false, erro:"Grandeza medida em outra unidade."}));
    s.perguntaAtual = { tipo:"unidades", enunciado:`Qual grandeza é medida em ${item.unidadeSI}?`, textoLacuna:null, opcoes: shuffle([{texto:item.grandeza, correta:true}, ...opcoesBase]) };
  } else if (variante === "base"){
    let opcoesBase = shuffle(outrosUnidade.filter(c=>c.equivalenciaBase && c.equivalenciaBase!==item.equivalenciaBase)).slice(0,3)
      .map(c=>({texto:c.equivalenciaBase, correta:false, erro:"Equivalência de outra unidade."}));
    const genericoBase = ["kg/s","m/s²","mol/s","J·s⁻¹"];
    let gbi = 0;
    while (opcoesBase.length < 3 && gbi < genericoBase.length){
      const g = genericoBase[gbi++];
      if (g !== item.equivalenciaBase && !opcoesBase.some(o=>o.texto===g)) opcoesBase.push({texto:g, correta:false, erro:"Equivalência de outra grandeza."});
    }
    s.perguntaAtual = { tipo:"unidades", enunciado:`${item.unidadeSI} equivale a quê em unidades de base?`, textoLacuna:null, opcoes: shuffle([{texto:item.equivalenciaBase, correta:true}, ...opcoesBase]) };
  } else {
    const ce = item.conversaoExemplo;
    s.perguntaAtual = { tipo:"unidades", enunciado:`${ce.enunciado}`, textoLacuna:null, opcoes: shuffle(ce.opcoes.map(o=>({texto:o.valor, correta:!!o.correta, erro:o.erro}))) };
  }
}

/* =========================================================================================
   RENDER — SESSÃO
   ========================================================================================= */
function renderSessao(){
  if (state.reforcoAtivo) return renderReforco();
  const s = state.sessao;
  const item = itemAtual();
  const total = s.itens.length;
  const pct = Math.round((s.indice/total)*100);
  const a = ASSUNTO_MAP[item.assunto];

  const head = `
    <div class="session-head">
      <button class="exit" onclick="sairSessao()">✕</button>
      <div class="info"><b>${a.emoji} ${esc(a.nome)}</b>Item ${s.indice+1} de ${total}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;

  if (s.modo === "flashcard") return renderFlashcard(head, item, a);
  renderPergunta(head, item, a);
}
window.sairSessao = function(){ state.reforcoAtivo = null; irPara('home'); };

/* ---- Flashcard ---- */
function renderFlashcard(head, item, a){

  const fronteira = invertido

    : `<div class="tag">${a.emoji} ${esc(a.nome)}</div><div class="nome">${esc(item.nome)}</div>${item.contexto?`<div class="ctx">${esc(item.contexto)}</div>`:''}`;

    ? `<div class="formula-big" style="font-size:18px;">${esc(item.nome)}</div>`
    : `<div class="formula-big">${renderFormula(item.formula)}</div>`;

  document.getElementById('app').innerHTML = `
    ${head}

          ${fronteira}

        </div>
        <div class="flash-face flash-back">
          ${versoTopo}
          <div class="vartable">${varsHtml}</div>
          ${item.condicao ? `<div class="meta-line"><b>Quando vale:</b> ${esc(item.condicao)}</div>` : ''}
          ${item.uso ? `<div class="meta-line"><b>Quando usar:</b> ${esc(item.uso)}</div>` : ''}
          ${item.erroComum ? `<div class="meta-line"><b>Erro comum:</b> ${esc(item.erroComum)}</div>` : ''}
          ${item.exemplo ? `<div class="meta-line"><b>Exemplo:</b> ${esc(item.exemplo)}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="flash-actions">

window.flipCard = function(){ state.sessao.flipped = !state.sessao.flipped; renderSessao(); };
window.inverterFlash = function(){ state.sessao.flashInvertido = !state.sessao.flashInvertido; renderSessao(); };
window.marcarFlash = function(sabe){
  const s = state.sessao, item = itemAtual();
  marcarCartao(item.id, sabe ? "domino" : "revisar");
  if (sabe){ s.marcSabe++; spawnConfetti(); } else { s.marcRevisar++; s.erroItens.push(item); }
  avancarFlashcard();
};
function avancarFlashcard(){
  const s = state.sessao;
  s.indice++; s.flipped = false;
  if (s.indice >= s.itens.length){ state.view = "resumo"; render(); return; }
  render();
}

/* ---- Quiz / Completar / Unidades ---- */
function renderPergunta(head, item, a){
  const s = state.sessao, p = s.perguntaAtual;
  const opcoesHtml = p.opcoes.map((op,i)=>{
    let cls = "";
    if (s.respondida){
      if (op.correta) cls = "correta";
      else if (op === s.selecionada) cls = "errada";
    }
    const txt = (p.tipo === 'quiz' && p.formulaExibida) ? esc(op.texto) : renderFormula(op.texto);
    return `<button class="opcao-btn ${cls}" ${s.respondida?'disabled':''} onclick="responder(${i})">
      <span class="letra">${letraOpcao(i)}</span><span class="txt">${txt}</span>
    </button>`;
  }).join("");

  const erroSel = (s.respondida && s.selecionada && !s.selecionada.correta && s.selecionada.erro)
    ? `<div class="erro-txt">❌ ${esc(s.selecionada.erro)}</div>` : "";

  const precisaReforco = s.respondida && s.selecionada && !s.selecionada.correta;

  document.getElementById('app').innerHTML = `
    ${head}
    <div class="question-card" style="--tcolor:${a.cor}">
      <div class="topic-tag">${a.emoji} ${esc(a.nome)}</div>
      <div class="enunciado">${esc(p.enunciado)}</div>
      ${p.formulaExibida ? `<div class="formula-lacuna">${renderFormula(p.formulaExibida)}</div>` : ''}
      ${p.textoLacuna ? `<div class="formula-lacuna">${renderFormula(p.textoLacuna)}</div>` : ''}
      <div class="opcoes">${opcoesHtml}</div>
      ${erroSel}
      ${s.respondida ? `<div class="feedback-row">
        ${precisaReforco ? `<button class="reforco-btn" onclick="treinarReforco()">💪 Reforço: 3 exercícios rápidos</button>` : ''}
        <button class="next-btn" onclick="proximaPergunta()">${s.indice+1<s.itens.length?'Próxima →':'Ver resultado →'}</button>
      </div>` : ''}
    </div>
  `;
}
window.responder = function(i){
  const s = state.sessao;
  if (s.respondida) return;
  const p = s.perguntaAtual;
  const escolhida = p.opcoes[i];
  s.selecionada = escolhida;
  s.respondida = true;
  const item = itemAtual();
  if (escolhida.correta){
    s.acertos++;
    marcarCartao(item.id, "domino");
    spawnConfetti();
  } else {
    s.erros++;
    s.erroItens.push(item);
    marcarCartao(item.id, "revisar");
  }
  renderSessao();
};
window.proximaPergunta = function(){
  const s = state.sessao;
  s.indice++;
  if (s.indice >= s.itens.length){ state.view = "resumo"; render(); return; }
  gerarPergunta();
  render();
};

/* =========================================================================================
   REFORÇO PÓS-ERRO (item 5.5) — não muda o estado do cartão; só aparece após o erro ou,
   no flashcard, por botão opcional. Progressão fixa Q1/Q2/Q3, não abre sozinho.
   ========================================================================================= */
window.treinarReforco = function(){
  const item = itemAtual();
  const lista = shuffle((item.reforco || []).map(q => ({
    ...q,
    _opcoes: shuffle(q.alternativas.map(a => ({...a})))
  })));
  // mantém a progressão fixa Q1/Q2/Q3 (não embaralha a ORDEM das questões, só reaproveita shuffle acima para opções)
  const ordenado = (item.reforco || []).map((q,idx) => ({ ...q, _opcoes: shuffle(q.alternativas.map(a=>({...a}))) }));
  state.reforcoAtivo = {
    cartaoId: item.id,
    cartaoNome: item.nome,
    cor: corDoItem(item),
    questoes: ordenado,
    indice: -1, // -1 = tela de abertura (botão "Começar" / "Pular")
    acertosReforco: 0,
    respondida: false,
    selecionada: null
  };
  render();
};
window.pularReforco = function(){ state.reforcoAtivo = null; render(); };
function renderReforco(){
  const r = state.reforcoAtivo;
  if (r.indice === -1){
    document.getElementById('app').innerHTML = `
      <div class="session-head"><button class="exit" onclick="pularReforco()">✕</button><div class="info"><b>${esc(r.cartaoNome)}</b>Reforço opcional</div></div>
      <div class="reforco-banner" style="background:linear-gradient(135deg,${r.cor},color-mix(in srgb, ${r.cor} 55%, white))">
        <div class="emoji">💪</div>
        <h2>Reforço: 3 exercícios rápidos</h2>
        <p style="color:#fff;opacity:.95;">Três contas simples com essa mesma fórmula, pra fixar pelo uso. Isso não muda o estado do cartão.</p>
      </div>
      <button class="big-btn" onclick="avancarReforco()">Começar →</button>
      <button class="ghost-btn" onclick="pularReforco()">Pular</button>
    `;
    return;
  }
  if (r.indice >= r.questoes.length){
    document.getElementById('app').innerHTML = `
      <div class="session-head"><button class="exit" onclick="pularReforco()">✕</button><div class="info"><b>${esc(r.cartaoNome)}</b>Resultado do reforço</div></div>
      <div class="card result-hero">
        <div class="emoji">${r.acertosReforco===3?'🎉':r.acertosReforco>=2?'💪':'🌱'}</div>
        <h2>Você acertou ${r.acertosReforco} de 3</h2>
        <p style="color:var(--ink-soft);font-weight:600;">O cartão continua como "preciso revisar" — ele só muda quando você acertar na própria sessão de estudo.</p>
      </div>
      <button class="big-btn" onclick="voltarAoCartao()">Voltar ao cartão</button>
    `;
    return;
  }
  const q = r.questoes[r.indice];
  const dots = r.questoes.map((_,i)=>{
    if (i === r.indice) return '<span class="reforco-dot atual"></span>';
    if (i < r.indice) return `<span class="reforco-dot ${q._acertouIdx && q._acertouIdx[i] ? 'ok':'bad'}"></span>`;
    return '<span class="reforco-dot"></span>';
  }).join("");
  const opcoesHtml = q._opcoes.map((op,i)=>{
    let cls = "";
    if (r.respondida){ if (op.correta) cls="correta"; else if (op===r.selecionada) cls="errada"; }
    return `<button class="opcao-btn ${cls}" ${r.respondida?'disabled':''} onclick="responderReforco(${i})">
      <span class="letra">${letraOpcao(i)}</span><span class="txt">${renderFormula(op.valor)}${q.unidade?` ${esc(q.unidade)}`:''}</span>
    </button>`;
  }).join("");
  document.getElementById('app').innerHTML = `
    <div class="session-head"><button class="exit" onclick="pularReforco()">✕</button><div class="info"><b>${esc(r.cartaoNome)}</b>Exercício ${r.indice+1} de ${r.questoes.length}</div></div>
    <div class="reforco-progress">${dots}</div>
    <div class="question-card" style="--tcolor:${r.cor}">
      <div class="enunciado">${esc(q.enunciado)}</div>
      <div class="opcoes">${opcoesHtml}</div>
      ${r.respondida ? `<div class="resolucao-box">${q.resolucao.map(l=>`<span class="linha">${renderFormula(l)}</span>`).join("")}</div>` : ''}
      ${r.respondida ? `<div class="feedback-row"><button class="next-btn" onclick="avancarReforco()">${r.indice+1<r.questoes.length?'Próximo exercício →':'Ver resultado →'}</button></div>` : ''}
    </div>
  `;
}
window.responderReforco = function(i){
  const r = state.reforcoAtivo;
  if (r.respondida) return;
  const q = r.questoes[r.indice];
  const op = q._opcoes[i];
  r.selecionada = op;
  r.respondida = true;
  if (op.correta) r.acertosReforco++;
  renderReforco();
};
window.avancarReforco = function(){
  const r = state.reforcoAtivo;
  r.indice++;
  r.respondida = false;
  r.selecionada = null;
  render();
};
window.voltarAoCartao = function(){
  state.reforcoAtivo = null;
  const s = state.sessao;
  if (s.modo === "flashcard") avancarFlashcard();
  else {
    const i2 = s.indice + 1;
    if (i2 >= s.itens.length){ state.view = "resumo"; render(); return; }
    s.indice = i2;
    gerarPergunta();
    render();
  }
};

/* =========================================================================================

function renderResumo(){

window.repetirSessao = function(){ state.modo = state.sessao.modo; iniciarSessao(); };
window.repetirErrados = function(){
  const revisarUnicos = [...new Map(state.sessao.erroItens.map(it=>[it.id,it])).values()];
  if (!revisarUnicos.length) return;
  state.sessao = { modo: state.sessao.modo, itens: shuffle(revisarUnicos), indice:0, acertos:0, erros:0, marcSabe:0, marcRevisar:0, erroItens:[], perguntaAtual:null, respondida:false, flashInvertido:false, flipped:false };
  if (state.sessao.modo !== "flashcard") gerarPergunta();
  state.reforcoAtivo = null;
  state.view = "sessao";

/* =========================================================================================
   MENU: exportar / importar / zerar progresso
   ========================================================================================= */
window.abrirMenu = function(){
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="ffq-menu" onclick="if(event.target===this) fecharMenu()">
      <div class="modal-box">
        <h3>⚙️ Menu</h3>
        <p>Seu progresso fica salvo neste navegador. Exporte um backup de vez em quando ou pra levar pra outro aparelho.</p>
        <div class="row"><button class="ghost-btn" onclick="exportarProgresso()">⬇️ Exportar progresso</button></div>
        <div class="row"><button class="ghost-btn" onclick="document.getElementById('ffq-import-input').click()">⬆️ Importar progresso</button></div>
        <input type="file" id="ffq-import-input" accept="application/json" onchange="importarProgresso(event)">
        <div class="row"><button class="ghost-btn warn" onclick="confirmarZerar()">🗑️ Zerar todo o progresso</button></div>
        <div class="row"><button class="big-btn" onclick="fecharMenu()">Fechar</button></div>
      </div>
    </div>
  `);
};
window.fecharMenu = function(){ const el = document.getElementById('ffq-menu'); if (el) el.remove(); };
window.exportarProgresso = function(){
  const payload = { schema: "ffq_progresso_v1", exportadoEm: new Date().toISOString(), progresso: PROGRESS };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `progresso-formulas-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup exportado ✅");
};
window.importarProgresso = function(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj.progresso !== "object") throw new Error("formato inválido");
      const idsValidos = new Set(CARDS.map(c=>c.id));
      let aceitos = 0, ignorados = 0;
      Object.entries(obj.progresso).forEach(([id, estado])=>{
        if (idsValidos.has(id) && ["novo","domino","revisar"].includes(estado)){ PROGRESS[id] = estado; aceitos++; }
        else ignorados++;
      });
      salvarProgresso();
      toast(`Importado: ${aceitos} cartões atualizados${ignorados?`, ${ignorados} ignorados`:''} ✅`);
      fecharMenu();
      render();
    } catch(e){
      toast("❌ Arquivo inválido — progresso atual mantido.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
};
window.confirmarZerar = function(){
  if (!confirm("Tem certeza que quer apagar TODO o progresso (Física e Química)?")) return;
  if (!confirm("Confirmando de novo: essa ação não pode ser desfeita. Apagar mesmo?")) return;
  PROGRESS = {};
  salvarProgresso();
  toast("Progresso zerado.");
  fecharMenu();
  render();
};

/* =========================================================================================
   validarCatalogo() — roda no console, confere integridade estrutural do catálogo
   ========================================================================================= */
function validarCatalogo(){
  const falhas = [];
  const idsVistos = new Set();
  CARDS.forEach(c=>{
    if (!c.id){ falhas.push(`Cartão sem id: ${(c.nome||'?')}`); return; }
    if (idsVistos.has(c.id)) falhas.push(`${c.id}: id duplicado`);
    idsVistos.add(c.id);
    if (c.tipo === "unidade"){
      if (!Array.isArray(c.distratoresUnidade) || c.distratoresUnidade.length < 3) falhas.push(`${c.id}: menos de 3 distratores de unidade`);
    } else {
      if (!Array.isArray(c.distratores) || c.distratores.length < 3) falhas.push(`${c.id}: menos de 3 distratores curados`);
      if (!c.formula) falhas.push(`${c.id}: sem campo formula`);
      if (!Array.isArray(c.variaveis) || !c.variaveis.length) falhas.push(`${c.id}: sem variaveis`);
    }
    if (!Array.isArray(c.reforco) || c.reforco.length !== 3){
      falhas.push(`${c.id}: reforço deve ter exatamente 3 itens (tem ${c.reforco?c.reforco.length:0})`);
    } else {
      c.reforco.forEach((r,idx)=>{
        if (!Array.isArray(r.alternativas) || r.alternativas.length !== 4){
          falhas.push(`${c.id} reforço Q${idx+1}: deve ter exatamente 4 alternativas`); return;
        }
        const corretas = r.alternativas.filter(a=>a.correta);
        if (corretas.length !== 1) falhas.push(`${c.id} reforço Q${idx+1}: deve ter exatamente 1 alternativa correta (tem ${corretas.length})`);
        else if (String(corretas[0].valor).trim() !== String(r.resposta).trim()) falhas.push(`${c.id} reforço Q${idx+1}: alternativa correta (${corretas[0].valor}) não bate com resposta (${r.resposta})`);
        const valores = r.alternativas.map(a=>String(a.valor).trim());
        if (new Set(valores).size !== valores.length) falhas.push(`${c.id} reforço Q${idx+1}: alternativas duplicadas (${valores.join(', ')})`);
        if (!r.enunciado) falhas.push(`${c.id} reforço Q${idx+1}: sem enunciado`);
        if (!Array.isArray(r.resolucao) || !r.resolucao.length) falhas.push(`${c.id} reforço Q${idx+1}: sem resolução`);
      });
    }
  });
  if (falhas.length === 0) console.log(`✅ validarCatalogo: ${CARDS.length} cartões, nenhuma falha encontrada.`);
  else { console.error(`❌ validarCatalogo: ${falhas.length} falha(s):`); falhas.forEach(f=>console.error(' - '+f)); }
  return falhas;
}
window.validarCatalogo = validarCatalogo;

/* =========================================================================================
   ATALHOS DE TECLADO (desktop): espaço=virar, setas=navegar, 1/2=domino/revisar
   ========================================================================================= */
document.addEventListener('keydown', (e)=>{
  if (state.view !== 'sessao' || !state.sessao || state.reforcoAtivo) return;
  if (state.sessao.modo === 'flashcard'){
    if (e.code === 'Space'){ e.preventDefault(); window.flipCard(); }
    else if (e.key === '1'){ window.marcarFlash(true); }
    else if (e.key === '2'){ window.marcarFlash(false); }
    else if (e.key === 'ArrowRight' && state.sessao.flipped){ /* no-op, usar marcação */ }
  } else {
    const s = state.sessao;
    if (!s.respondida && ['1','2','3','4','5'].includes(e.key)){
      const idx = parseInt(e.key,10) - 1;
      if (s.perguntaAtual && s.perguntaAtual.opcoes[idx]) window.responder(idx);
    } else if (s.respondida && e.key === 'ArrowRight'){
      window.proximaPergunta();
    }
  }
});

/* =========================================================================================
   ROTEAMENTO / INIT
   ========================================================================================= */
window.irPara = function(view){
  state.view = view;
  if (view === "home"){ state.disciplina=null; state.assuntosSelecionados=[]; state.poolRevisar=false; state.modo=null; }
  render();
};
function render(){
  if (state.view === "home") renderHome();
  else if (state.view === "assuntos") renderAssuntos();
  else if (state.view === "modo") renderModo();
  else if (state.view === "sessao") renderSessao();
  else if (state.view === "resumo") renderResumo();
}

construirPools();
validarCatalogo();
render();
</script>
